name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Week 7 Clean Architecture (campus_notify)
        working-directory: ./07-week-7-clean-architecture/campus_notify
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test test/announcement_usecases_test.dart test/auth_usecases_test.dart test/auth_push_test.dart test/formatters_test.dart

      - name: Verify Week 5 Offline Notes (week5_offline_notes)
        working-directory: ./05-week-5-local-storage-offline-first/week5_offline_notes
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test test/note_test.dart test/validate_note_test.dart

      - name: Verify Week 9 AI-Assisted Development (week9_notes_app)
        working-directory: ./09-week-9-ai-assisted-development/week9_notes_app
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test test/search_filter_test.dart test/note_test.dart test/validate_note_test.dart

      - name: Verify Week 10 AI Feature Integration (10-week-10-ai-feature-integration)
        working-directory: ./10-week-10-ai-feature-integration
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test test/ai_service_test.dart test/chat_screen_widget_test.dart test/announcement_usecases_test.dart test/auth_usecases_test.dart test/auth_push_test.dart test/formatters_test.dart

      - name: Verify Week 11 Performance Optimization (11-week-11-performance-optimization)
        working-directory: ./11-week-11-performance-optimization
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test test/performance_optimization_test.dart test/ai_service_test.dart test/chat_screen_widget_test.dart test/announcement_usecases_test.dart test/auth_usecases_test.dart test/auth_push_test.dart test/formatters_test.dart

      - name: Verify Week 12 Testing & Quality Assurance (12-week-12-testing-quality-assurance)
        working-directory: ./12-week-12-testing-quality-assurance
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test test/unit_and_edge_cases_test.dart test/fake_repository_dependency_test.dart test/widget_interaction_test.dart test/performance_optimization_test.dart test/ai_service_test.dart test/chat_screen_widget_test.dart test/announcement_usecases_test.dart test/auth_usecases_test.dart test/auth_push_test.dart test/formatters_test.dart


